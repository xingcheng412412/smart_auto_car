/**:
  ros__parameters:
    use_sim_time: false
    feature_extract_enable: false
    point_filter_num: 4
    max_iteration: 4
    filter_size_surf: 0.25
    filter_size_map: 0.25
    cube_side_length: 200.0
    runtime_pos_log_enable: false
    common:
      lid_topic: /fairy/points
      imu_topic: /fairy/imu
      time_sync_en: false
      time_offset_lidar_to_imu: 0.0
    preprocess:
      lidar_type: 2  # Adapter emits Velodyne-compatible fields, not a Velodyne sensor.
      scan_line: 48
      scan_rate: 10
      timestamp_unit: 0  # FLOAT32 time is relative seconds, not absolute timestamp.
      blind: 0.5
    mapping:
      acc_cov: 0.1
      gyr_cov: 0.1
      b_acc_cov: 0.0001
      b_gyr_cov: 0.0001
      fov_degree: 360.0
      det_range: 50.0
      extrinsic_est_en: false
      # Inverse of device DIFOP IMU pose in LiDAR frame; see docs/calibration.md.
      # Translation assumes metres; verify manufacturer units before accuracy claims.
      extrinsic_T: [-0.0136261061, -0.0079281606, -0.0048119441]
      extrinsic_R: [0.9999080753, -0.0091755740, 0.0099824721,
                    0.0092108492, 0.9999514767, -0.0034934992,
                   -0.0099499328, 0.0035851251, 0.9999440713]
    publish:
      path_en: true
      effect_map_en: false
      map_en: false  # Independent voxel accumulator stores the complete session.
      scan_publish_en: true
      dense_publish_en: false
      scan_bodyframe_pub_en: true
    pcd_save:
      pcd_save_en: false
      interval: -1
