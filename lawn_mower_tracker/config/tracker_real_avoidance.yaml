# Real vehicle: same geometry/mount as the model; consumes the raw rslidar frame.
lawn_mower_tracker:
  ros__parameters:
    path_file: ''
    path_root: ~/fw_mini_pro_control_ros2/recorded_files
    path_filename: lawn_mower_records.csv
    csv_x_column: pose_x
    csv_y_column: pose_y
    csv_z_column: pose_z
    csv_yaw_column: yaw
    z_enabled: false
    odom_topic: /gnss_pose
    vehicle_cmd_topic: /vehicle_cmd
    path_status_topic: /path_status
    control_service: /mowerTrackControl
    wheelbase: 0.36
    control_rate_hz: 50.0
    rtk_timeout_sec: 0.5
    max_angular_speed: 0.8
    lookahead_distance: 0.6
    min_velocity: 0.1
    max_velocity: 0.15
    max_steering_angle: 0.942477796
    slowdown_distance: 0.7
    stop_distance: 0.2
    terminal_alignment_distance: 0.8
    terminal_yaw_tolerance: 0.174532925
    search_back_points: 5
    search_forward_points: 30
    steering_gain: 1.0
    max_slope_tangent: 0.3
    direction_switch_distance: 0.5
    log_enabled: false
    log_directory: ''
    initial_search_distance: 10.0
    initial_search_points: 10
    max_start_distance: 3.0
    use_sim_time: false
    avoidance_enabled: true
    obstacle_cloud_topic: /rslidar_points
    obstacle_cloud_frame: rslidar
    obstacle_timeout_sec: 0.3
    avoidance_max_speed: 0.15
    avoidance_planning_distance: 3.6
    avoidance_braking_deceleration: 0.3
    lidar_origin_height: 0.483976069
    body_half_length: 0.3
    body_half_width: 0.19
    body_min_z: -0.09
    body_max_z: 0.57
    obstacle_min_height: -0.04
    obstacle_max_height: 0.55
    obstacle_safety_margin: 0.2
    avoidance_range: 5.0
    avoidance_resolution: 0.12
    avoidance_max_expansions: 18000
